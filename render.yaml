services:
  - type: web
    name: ai-research-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
        placeholder: "Your Gemini API Key (AIzaSy...)"
        description: "Enter your Gemini API Key. If left empty, you must enter it in the application's Settings UI."
